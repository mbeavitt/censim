[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censim"
version = "0.1.0"
description = "Centromere simulation package for replicated assemblies study"
dependencies = [
    "numpy",
    "pandas",
    "biopython",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"